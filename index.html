

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090910">
  <title>SOUNDORA — Feel Every Beat</title>
  <meta name="description" content="SOUNDORA - Discover and enjoy your music.">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-icon">♫</span>
      <span>SOUND<span>ORA</span></span>
    </a>
    <span class="top-tag">YOUR MUSIC SPACE</span>
  </header>

  <main class="main-content">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">WELCOME TO SOUNDORA</p>
        <h1>Feel every <span>beat.</span></h1>
        <p class="hero-description">Your music. Your mood. Your world.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-circle circle-one"></div>
        <div class="art-circle circle-two"></div>
        <div class="art-note">♫</div>
      </div>
    </section>

    <section class="search-section">
      <label class="search-box">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search songs or artists..." autocomplete="off">
        <kbd>SEARCH</kbd>
      </label>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">EXPLORE</p>
          <h2>Browse Categories</h2>
        </div>
      </div>
      <div class="category-list" id="categoryList">
        <button class="category active" data-category="All">All Music</button>
        <button class="category" data-category="Hindi">Hindi</button>
        <button class="category" data-category="Punjabi">Punjabi</button>
        <button class="category" data-category="Haryanvi">Haryanvi</button>
        <button class="category" data-category="Bhojpuri">Bhojpuri</button>
      </div>
    </section>

    <section class="section music-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow" id="listEyebrow">MADE FOR YOUR MOOD</p>
          <h2 id="listTitle">Trending Music</h2>
        </div>
        <span class="song-count" id="songCount">0 SONGS</span>
      </div>

      <div class="song-list" id="songList"></div>
      <p class="empty-message" id="emptyMessage" hidden>No songs found.</p>
    </section>
  </main>

  <footer class="player" id="musicPlayer">
    <div class="player-top">
      <div class="player-song">
        <div class="player-cover" id="playerCover">♫</div>
        <div class="player-details">
          <strong id="nowPlaying">Choose a song</strong>
          <span id="playerArtist">SOUNDORA</span>
        </div>
        <button class="favorite-btn" id="favoriteBtn" aria-label="Add to favorites">♡</button>
      </div>

    

      <div class="player-volume">
        <span>♫</span>
        <input id="volumeControl" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
      </div>
    </div>

    <div class="progress-area">
      <span id="currentTime">0:00</span>
      <input id="progressBar" type="range" min="0" max="100" value="0" aria-label="Song progress">
      <span id="duration">0:00</span>
    </div>

    <p class="player-message" id="playerMessage" aria-live="polite"></p>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" id="homeNav">
        <span>⌂</span><small>Home</small>
      </button>
      <button class="nav-item" id="searchNav">
        <span>⌕</span><small>Search</small>
      </button>
      <button class="nav-item" id="libraryNav">
        <span>♡</span><small>Library</small>
      </button>
    </nav>

    <audio id="audioPlayer" preload="metadata"></audio>
  </footer>

</body>
</html>
